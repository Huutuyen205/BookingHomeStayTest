# ============================================================
# CAU HINH DATABASE
# ============================================================
# Truoc day mat khau DB bi ghi cung ("Huutuyen123@") ngay trong file nay va se
# bi day len Git cung mã nguon - rat khong an toan. Da doi sang doc tu bien moi
# truong (environment variable), neu chua set thi dung gia tri mac dinh sau dau ":".
# Cach chay: set DB_PASSWORD=matkhaucuaban roi chay lai ung dung (hoac sua truc
# tiep gia tri mac dinh ben duoi neu chi chay local mot minh).
spring.datasource.url=jdbc:mysql://localhost:3306/homestay_booking_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Huutuyen123@}

# update = Hibernate tu tao/sua bang con thieu (vd bang "collaborators" moi thêm)
# ma KHONG xoa du lieu cu. Khi len production nen chuyen sang "validate" va
# quan ly schema bang Flyway/Liquibase de tranh rui ro mat du lieu.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

