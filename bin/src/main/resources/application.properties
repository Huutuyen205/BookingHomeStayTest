# TASK 7 - OTP qua Email: ĐIỀN THẬT 2 dòng username/password bên dưới thì email
# OTP, email "đăng ký thành công", email "đánh giá sau khi trả phòng" sẽ GỬI
# ĐƯỢC THẬT. Nếu vẫn để giá trị mẫu như hiện tại, hệ thống vẫn chạy bình thường,
# chỉ là email sẽ gửi lỗi (không có gì hỏng) và mã OTP sẽ được in ra CONSOLE
# (cửa sổ chạy ./mvnw) để bạn vẫn đăng ký/demo được - xem log dòng [OTP-EMAIL].
#
# Hướng dẫn lấy App Password cho Gmail (bắt buộc nếu dùng Gmail, KHÔNG dùng được
# mật khẩu Gmail thường):
#   1. Bật xác thực 2 bước (2-Step Verification) cho tài khoản Gmail
#   2. Vào https://myaccount.google.com/apppasswords
#   3. Tạo 1 App Password mới (chọn "Mail") -> copy chuỗi 16 ký tự đó
#   4. Dán chuỗi đó vào spring.mail.password bên dưới (KHÔNG phải mật khẩu Gmail thường)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=dan-app-password-16-ky-tu-vao-day
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dung de sinh link tuyet doi trong email (vd: link truy cap trang web sau khi
# dang ky - task 8). Doi thanh domain that khi len production (vd https://bookinghomestay.vn)
app.base-url=http://localhost:8080

# ============================================================
# CAP NHAT 09/2026 - OTP qua ZALO (Zalo Notification Service - ZNS): ĐIỀN THẬT
# 4 dòng dưới đây thì OTP sẽ gửi thật qua Zalo. Nếu để trống, hệ thống vẫn chạy
# bình thường, chỉ là mã OTP sẽ in ra CONSOLE (dòng [ZALO-ZNS]) để bạn vẫn demo
# được, và giao diện đăng ký sẽ báo trung thực là "chưa gửi được qua Zalo thật"
# thay vì báo nhầm thành công như trước đây.
#
# Cách lấy 4 giá trị này:
#   1. Tạo 1 Official Account (OA) tại https://oa.zalo.me (nếu chưa có)
#   2. Tạo 1 App tại https://developers.zalo.me, chọn loại "Official Account API"
#      -> lấy app-id và app-secret ở đây
#   3. Trong App vừa tạo, vào mục "Cấu hình OA" > gắn OA của bạn vào App, rồi
#      làm theo hướng dẫn "Lấy quyền truy cập OA" (quét mã QR xác nhận 1 lần) để
#      lấy refresh-token lần đầu tiên
#   4. Tạo 1 mẫu tin nhắn (template) loại OTP tại mục "Quản lý mẫu tin" của OA,
#      điền đúng biến {{otp}}, gửi Zalo duyệt nội dung (thường 1-2 ngày làm việc)
#      -> sau khi duyệt xong sẽ có otp-template-id
#
# LƯU Ý: mỗi lần hệ thống tự làm mới access_token, Zalo sẽ cấp 1 refresh-token
# MỚI (cái cũ hết hạn ngay). Hệ thống tự dùng refresh-token mới trong lúc đang
# chạy, nhưng nếu bạn RESTART ứng dụng thì phải cập nhật lại giá trị mới nhất
# vào dòng zalo.oa.refresh-token bên dưới (xem log dòng "[ZALO-ZNS] Zalo da cap
# refresh_token MOI" để lấy giá trị mới nhất trước khi restart).
# ============================================================
zalo.oa.app-id=
zalo.oa.app-secret=
zalo.oa.refresh-token=
zalo.oa.otp-template-id=
